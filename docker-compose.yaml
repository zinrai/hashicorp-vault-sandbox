# The official image as is, not an image of our own: /vault/config,
# /vault/file and /vault/logs already exist in it, owned by the vault user.
x-vault: &vault
  image: hashicorp/vault:2.1.1
  command: server
  restart: unless-stopped
  # group_add, not 0644 or chown: node keys and configuration stay 0640 as
  # on a host (root:vault), and the vault user reads them through the group.
  group_add:
    - "${HOST_GID:-1000}"

# A profile, not always on: the Workload Vault cannot start until its seal
# has been provisioned.
x-workload: &workload
  <<: *vault
  profiles: [workload-vault]
  # dev unless .env names a KMS key: the development seal serves no other.
  environment:
    VAULT_TRANSIT_SEAL_KEY_NAME: ${WORKLOAD_SEAL_KEY_NAME:-dev}

# The vault image and user, not an image of our own: the socket must belong
# to the vault user, and the seal needs nothing else. Which seal, from
# WORKLOAD_SEAL, not fixed: any server of Vault's transit API will do, and
# the nodes' configuration is the same for each.
x-seal: &seal
  image: hashicorp/vault:2.1.1
  profiles: [workload-vault]
  restart: unless-stopped
  entrypoint: ["/usr/local/bin/vault-seal", "-socket", "/vault/seal/kms.sock"]
  # group_add, as for the nodes: the development seal's key stays 0640, and
  # the vault user reads it through the group.
  group_add:
    - "${HOST_GID:-1000}"
  # Not on the workload-vault network: it needs at most the way out to a
  # KMS API.
  # The development key's path, fixed here, not provisioned: it is no
  # secret, and only vault-seal-dev reads it. A KMS's credentials, secret,
  # from seal.env.
  environment:
    VAULT_SEAL_DEV_KEY: /vault/seal-key/key.gpg
  env_file:
    - path: workload-vault/seal.env
      required: false

# The image as is, with its configuration and the CA certificate mounted,
# as a host would have them.
x-load-balancer: &load-balancer
  image: haproxy:3.2
  restart: unless-stopped


services:
  foundation-vault-lb:
    <<: *load-balancer
    container_name: foundation-vault-lb
    volumes:
      - ./foundation-vault/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./foundation-vault/ca/root.crt:/usr/local/etc/haproxy/ca.crt:ro
    networks:
      foundation-vault:
        ipv4_address: 172.28.0.5

  foundation-vault-0:
    <<: *vault
    container_name: foundation-vault-0
    volumes:
      - ./foundation-vault/config/foundation-vault-0:/vault/config:ro
      - ./foundation-vault/tls/foundation-vault-0:/vault/tls:ro
      - foundation-vault-0-data:/vault/file
      - foundation-vault-0-audit:/vault/logs
    networks:
      foundation-vault:
        ipv4_address: 172.28.0.10

  foundation-vault-1:
    <<: *vault
    container_name: foundation-vault-1
    volumes:
      - ./foundation-vault/config/foundation-vault-1:/vault/config:ro
      - ./foundation-vault/tls/foundation-vault-1:/vault/tls:ro
      - foundation-vault-1-data:/vault/file
      - foundation-vault-1-audit:/vault/logs
    networks:
      foundation-vault:
        ipv4_address: 172.28.0.11

  foundation-vault-2:
    <<: *vault
    container_name: foundation-vault-2
    volumes:
      - ./foundation-vault/config/foundation-vault-2:/vault/config:ro
      - ./foundation-vault/tls/foundation-vault-2:/vault/tls:ro
      - foundation-vault-2-data:/vault/file
      - foundation-vault-2-audit:/vault/logs
    networks:
      foundation-vault:
        ipv4_address: 172.28.0.12

  workload-vault-lb:
    <<: *load-balancer
    container_name: workload-vault-lb
    profiles: [workload-vault]
    volumes:
      - ./workload-vault/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./workload-vault/ca/root.crt:/usr/local/etc/haproxy/ca.crt:ro
    networks:
      workload-vault:
        ipv4_address: 172.29.0.5

  workload-vault-0:
    <<: *workload
    container_name: workload-vault-0
    volumes:
      - ./workload-vault/config/workload-vault-0:/vault/config:ro
      - ./workload-vault/tls/workload-vault-0:/vault/tls:ro
      - workload-vault-0-data:/vault/file
      - workload-vault-0-audit:/vault/logs
      - workload-vault-0-seal:/vault/seal
    networks:
      workload-vault:
        ipv4_address: 172.29.0.10

  workload-vault-0-seal:
    <<: *seal
    container_name: workload-vault-0-seal
    volumes:
      - ./bin/${WORKLOAD_SEAL:-vault-seal-dev}:/usr/local/bin/vault-seal:ro
      - ./workload-vault/seal-key:/vault/seal-key:ro
      - workload-vault-0-seal:/vault/seal

  workload-vault-1:
    <<: *workload
    container_name: workload-vault-1
    volumes:
      - ./workload-vault/config/workload-vault-1:/vault/config:ro
      - ./workload-vault/tls/workload-vault-1:/vault/tls:ro
      - workload-vault-1-data:/vault/file
      - workload-vault-1-audit:/vault/logs
      - workload-vault-1-seal:/vault/seal
    networks:
      workload-vault:
        ipv4_address: 172.29.0.11

  workload-vault-1-seal:
    <<: *seal
    container_name: workload-vault-1-seal
    volumes:
      - ./bin/${WORKLOAD_SEAL:-vault-seal-dev}:/usr/local/bin/vault-seal:ro
      - ./workload-vault/seal-key:/vault/seal-key:ro
      - workload-vault-1-seal:/vault/seal

  workload-vault-2:
    <<: *workload
    container_name: workload-vault-2
    volumes:
      - ./workload-vault/config/workload-vault-2:/vault/config:ro
      - ./workload-vault/tls/workload-vault-2:/vault/tls:ro
      - workload-vault-2-data:/vault/file
      - workload-vault-2-audit:/vault/logs
      - workload-vault-2-seal:/vault/seal
    networks:
      workload-vault:
        ipv4_address: 172.29.0.12

  workload-vault-2-seal:
    <<: *seal
    container_name: workload-vault-2-seal
    volumes:
      - ./bin/${WORKLOAD_SEAL:-vault-seal-dev}:/usr/local/bin/vault-seal:ro
      - ./workload-vault/seal-key:/vault/seal-key:ro
      - workload-vault-2-seal:/vault/seal


# No published ports: the host reaches the nodes on the bridge networks at
# the addresses they use for each other, so the certificates match. Two
# networks, not one: the Workload Vault must not reach the Foundation Vault
# at runtime.
networks:
  foundation-vault:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  workload-vault:
    ipam:
      config:
        - subnet: 172.29.0.0/24

# tmpfs owned by the vault user, not a plain volume: a plain volume is
# created root-owned, and the socket has no business on disk.
x-seal-socket: &seal-socket
  driver_opts:
    type: tmpfs
    device: tmpfs
    o: "uid=100,gid=1000,mode=0750"

volumes:
  foundation-vault-0-data:
  foundation-vault-1-data:
  foundation-vault-2-data:
  foundation-vault-0-audit:
  foundation-vault-1-audit:
  foundation-vault-2-audit:
  workload-vault-0-data:
  workload-vault-1-data:
  workload-vault-2-data:
  workload-vault-0-audit:
  workload-vault-1-audit:
  workload-vault-2-audit:
  workload-vault-0-seal: *seal-socket
  workload-vault-1-seal: *seal-socket
  workload-vault-2-seal: *seal-socket
