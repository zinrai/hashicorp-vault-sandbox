global
  log stdout format raw local0

# TCP, not HTTP: TLS goes through to the nodes, so the load balancer holds
# no certificate and no key.
defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 5m
  timeout server 5m

frontend vault
  bind 172.28.0.5:8200
  default_backend active

# The active node only, not every node that accepts connections: a sealed
# node accepts them too, and a standby would only forward to the active
# one. The PROXY header carries the client's address, for the audit log.
backend active
  option httpchk GET /v1/sys/health
  http-check expect status 200
  default-server check inter 2s fall 2 rise 2 check-ssl verify required ca-file /usr/local/etc/haproxy/ca.crt send-proxy-v2 check-send-proxy
  server foundation-0 172.28.0.10:8200
  server foundation-1 172.28.0.11:8200
  server foundation-2 172.28.0.12:8200
